  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

px solid #DAD6CA\">Why five days<\u002Fa>\n<\u002Fdiv>\n<p class=\"in3\" style=\"margin: 18px 0 0; font-size: 14px; color: #5A584F\">Free for all five days. One small task a day, at your own pace.<\u002Fp>\n\n<div class=\"in4\" style=\"position: relative; width: 1040px; height: 440px; margin-top: 64px; background: #F3F2FE; border: 1px solid #E7E5FD; border-radius: 28px; text-align: left; overflow: hidden\">\n<div style=\"position: absolute; left: 50%; top: 24px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E7E5FD; border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: #453BC3\">\n<span style=\"width: 8px; height: 8px; border-radius: 999px; background: #F0603C\"><\u002Fspan>Day 5 of 5 · Fresh discovery\n<\u002Fdiv>\n\n<div style=\"position: absolute; left: 60px; top: 74px; width: 340px; height: 300px; background: #FFFFFF; border: 1px solid #ECE9E1; border-radius: 20px; box-shadow: 0 2px 4px rgba(26,26,26,0.04), 0 18px 40px -24px rgba(20,16,60,0.45)\">\n<div style=\"position: absolute; left: 24px; top: 24px; display: flex; align-items: center; gap: 12px\">\n<div style=\"width: 48px; height: 48px; border-radius: 999px; background: #5448EE; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px\">You<\u002Fdiv>\n<div><div style=\"font-weight: 700; font-size: 17px\">You<\u002Fdiv><div style=\"font-size: 13px; color: #5A584F; margin-top: 2px\">Startup Owner · clinic booking idea<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: absolute; left: 24px; top: 104px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A584F\">Seeking<\u002Fdiv>\n<div class=\"hlA\" style=\"position: absolute; left: 24px; right: 24px; top: 126px; height: 40px; display: flex; align-items: center; padding: 0 14px; border: 1px solid #DAD6CA; border-radius: 10px; font-size: 15px; font-weight: 500; play: flex; align-items: center; justify-content: space-between\">\n<span style=\"font-size: 13px; font-weight: 700; color: #1A1A1A\">Day {{ cur.n }} of 5<\u002Fspan>\n<span style=\"font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; {{ cur.badgeStyle }}\">{{ cur.feat }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top: 12px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px\">\n<sc-for list=\"{{ segs }}\" as=\"s\" hint-placeholder-count=\"5\">\n<span class=\"seg\" style=\"height: 6px; border-radius: 6px; {{ s.style }}\"><\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; font-size: 18px; line-height: 1.5; font-weight: 600; color: #1A1A1A\">{{ cur.task }}<\u002Fp>\n<div style=\"margin-top: 22px; display: flex; align-items: center; justify-content: space-between\">\n<span style=\"font-size: 13px; color: #5A584F\">{{ personaLabel }}<\u002Fspan>\n<span style=\"font-size: 14px; font-weight: 700; color: #FFFFFF; padding: 10px 16px; border-radius: 10px; {{ cur.ctaStyle }}\">{{ cur.cta }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #ECE9E1; border-radius: 24px; padding: 40px; display: flex; flex-direction: column; justify-content: center\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5A584F\">Why this day<\u002Fp>\n<p style=\"margin: 14px 0 0; font-size: 24px; line-height: 1.4; letter-spacing: -0.015em; font-weight: 600; color: #1A1A1A\">{{ cur.why }}<\u002Fp>\n<div style=\"margin-top: 28px; padding-top: 22px; border-top: 1px solid #ECE9E1; display: flex; gap: 12px; align-items: flex-start\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5448EE\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 2\"><\u002Fpath><\u002Fsvg>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.55; color: #5A584F\">{{ paceNote }}<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top: 26px; display: flex; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{ prevDay }}\" class=\"ghost\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 1px solid #DAD6CA; background: #FFFFFF; color: #1A1A1A; cursor: pointer\">Previous day<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ nextDay }}\" class=\"btn\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px; border: 1px solid #1A1A1A; background: #1A1A1A; color: #FFFFFF; cursor: pointer\">Next day<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" class=\"rv\" style=\"max-width: 820px; margin: 0 auto; padding: 40px 32px 110px; text-align: center\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #5448EE\">Why five days<\u002Fp>\n<h2 style=\"margin: 14px 0 0; font-size: 48px; line-height: 1.1; letter-spacing: -0.035em; font-weight: 800\">Why five days?<\u002Fh2>\n<p style=\"margin: 20px 0 0; font-size: 20px; line-height: 1.65; color: #1A1A1A; font-weight: 600\">Pick who you are to see your five days.<\u002Fp>\n<p style=\"margin: 20px 0 0; font-size: 20px; line-height: 1.65; color: #5A584F\">Diskorse gives you different ways to talk to people: Snippets, Problem Solver, Collective, Brand Queries, Counsel and Articles. Over five days you try them one at a time, with one small task a day picked for who you are. Every task builds your brand presence, and it shows us who your ideal customer is, so we can introduce you to the right people.<\u002Fp>\n\n<div style=\"margin-top: 48px; display: flex; justify-content: center; flex-wrap: wrap; gap: 14px\">\n<span class=\"t1\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #F3F2FE; color: #453BC3; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #5448EE\"><\u002Fspan>Snippet<\u002Fspan>\n<span class=\"t2\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #E9E2FC; color: #5328C4; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #6C3CE9\"><\u002Fspan>Problem Solver<\u002Fspan>\n<span class=\"t3\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #E0F4F6; color: #0F6770; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #137C86\"><\u002Fspan>Collective<\u002Fspan>\n<span class=\"t4\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #FFE0F6; color: #A3137A; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #A3137A\"><\u002Fspan>Brand Query<\u002Fspan>\n<span class=\"t5\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #DFDDE9; color: #2A1B6B; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #2A1B6B\"><\u002Fspan>Counsel<\u002Fspan>\n<span class=\"t6\" style=\"display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: #DDEDEA; color: #17705C; font-size: 15px; font-weight: 600\"><span style=\"width: 8px; height: 8px; border-radius: 999px; background: #1F8A72\"><\u002Fspan>Article<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"deck\" style=\"background: #191540; color: #FFFFFF\">\n<div style=\"max-width: 1120px; margin: 0 auto; padding: 120px 32px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; align-items: center\">\n<div class=\"rv\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F7A58F\">Day five<\u002Fp>\n<h2 style=\"margin: 14px 0 0; font-size: 50px; line-height: 1.06; letter-spacing: -0.035em; font-weight: 800\">Real people, not a score.<\u002Fh2>\n<p style=\"margin: 22px 0 0; font-size: 18px; line-height: 1.65; color: #C9C5EC\">On day five your deck opens. Diskorse suggests people who fit your tags and you swipe through them right there. The payoff is whoever is waiting when you come back.<\u002Fp>\n<div style=\"margin-top: 34px; display: flex; flex-direction: column; gap: 20px\">\n<div style=\"display: flex; gap: 14px\"><span style=\"flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><div style=\"font-weight: 700; font-size: 16px\">The full pool<\u002Fdiv><div style=\"margin-top: 4px; font-size: 15px; line-height: 1.55; color: #C9C5EC\">Everyone who fits, not only people who already swiped on you.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px\"><span style=\"flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><div style=\"font-weight: 700; font-size: 16px\">Mutual only<\u002Fdiv><div style=\"margin-top: 4px; font-size: 15px; line-height: 1.55; color: #C9C5EC\">A right swipe stays private. Chat opens only when both of you say yes, and nobody sits on a pending request.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px\"><span style=\"flex-shrink: 0; width: 30px; height: 30px; border-radius: 999px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fspan><div><div style=\"font-weight: 700; font-size: 16px\">A shortcut when they're open for it<\u002Fdiv><div style=\"margin-top: 4px; font-size: 15px; line-height: 1.55; color: #C9C5EC\">Swipe right on someone with a live Counsel plan, Brand Query or Problem Solver and you can act on it straight away.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 34px 0 0; font-size: 14px; color: #9D98CF\">Try it. Drag the top card, or use the buttons. Example deck for a Startup Owner.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; align-items: center\">\n<div style=\"display: flex; padding: 4px; background: rgba(255,255,255,0.08); border-radius: 999px; gap: 4px\">\n<button type=\"button\" sc-camel-on-click=\"{{ lensSeek }}\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 0; cursor: pointer; {{ lensSeekStyle }}\">People offering what I seek<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ lensOffer }}\" style=\"font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; border: 0; cursor: pointer; {{ lensOfferStyle }}\">People seeking what I offer<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"position: relative; width: 400px; height: 470px; margin-top: 28px\">\n<sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n<div class=\"{{ c.cls }}\" sc-camel-on-pointer-down=\"{{ c.down }}\" sc-camel-on-pointer-move=\"{{ c.move }}\" sc-camel-on-pointer-up=\"{{ c.up }}\" sc-camel-on-pointer-cancel=\"{{ c.up }}\" style=\"position: absolute; left: 0; top: 0; width: 400px; height: 440px; box-sizing: border-box; background: #FFFFFF; color: #1A1A1A; border-radius: 22px; padding: 26px; touch-action: pan-y; user-select: none; box-shadow: 0 30px 60px -30px rgba(0,0,0,0.6); {{ c.style }}\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<span style=\"width: 56px; height: 56px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; {{ c.avStyle }}\">{{ c.initials }}<\u002Fspan>\n<div style=\"flex-grow: 1\"><div style=\"font-weight: 700; font-size: 20px; letter-spacing: -0.01em\">{{ c.name }}<\u002Fdiv><div style=\"margin-top: 3px; font-size: 14px; color: #5A584F\">{{ c.role }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ c.hasDirect }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #FBF2E2; color: #8A5A12; font-size: 12px; font-weight: 700\"><span style=\"width: 6px; height: 6px; border-radius: 999px; background: #E0A63A\"><\u002Fspan>{{ c.directBadge }}<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"margin-top: 18px; padding: 16px; border-radius: 14px; background: #F3F2FE\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #453BC3\">Why you're matched<\u002Fdiv>\n<div style=\"margin-top: 8px; font-size: 15px; line-height: 1.5; color: #1A1A1A\">{{ c.why }}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 16px; display: flex; flex-direction: column; gap: 12px\">\n<div><div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A584F\">Seeking<\u002Fdiv><div style=\"margin-top: 4px; font-size: 15px; font-weight: 500\">{{ c.seeking }}<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A584F\">Offering<\u002Fdiv><div style=\"margin-top: 4px; font-size: 15px; font-weight: 500\">{{ c.offering }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: absolute; left: 26px; right: 26px; bottom: 22px; display: flex; justify-content: space-between; font-size: 13px; color: #5A584F\"><span>Snippet · {{ c.proof }}<\u002Fspan><span>{{ c.vouches }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<sc-if value=\"{{ deckDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; left: 0; top: 0; width: 400px; height: 440px; box-sizing: border-box; border: 1.5px dashed rgba(255,255,255,0.3); border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; gap: 14px\">\n<div style=\"font-size: 22px; font-weight: 700\">That's today's deck.<\u002Fdiv>\n<div style=\"font-size: 15px; line-height: 1.55; color: #C9C5EC\">Come back tomorrow to see who swiped back. Matches and replies wait for you in Messages.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ restart }}\" class=\"btn\" style=\"font: inherit; margin-top: 8px; font-size: 14px; font-weight: 700; padding: 11px 18px; border-radius: 10px; border: 0; background: #FFFFFF; color: #191540; cursor: pointer\">Start over<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showMatch }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; left: -20px; top: -10px; width: 440px; height: 480px; box-sizing: border-box; background: rgba(25,21,64,0.94); border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 36px; z-index: 20\">\n<div style=\"display: flex\"><span style=\"width: 64px; height: 64px; border-radius: 999px; background: #5448EE; border: 3px solid #191540; display: flex; align-items: center; justify-content: center; font-weight: 700\">You<\u002Fspan><span style=\"margin-left: -14px; width: 64px; height: 64px; border-radius: 999px; border: 3px solid #191540; display: flex; align-items: center; justify-content: center; font-weight: 700; {{ matchAv }}\">{{ matchInitials }}<\u002Fspan><\u002Fdiv>\n<div style=\"margin-top: 20px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em\">It's a match<\u002Fdiv>\n<div style=\"margin-top: 8px; font-size: 15px; line-height: 1.55; color: #C9C5EC\">You and {{ matchName }} both swiped right. Chat is open.<\u002Fdiv>\n<div style=\"margin-top: 20px; width: 100%; text-align: left; background: rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; box-sizing: border-box\">\n<div style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9D98CF\">Suggested first message<\u002Fdiv>\n<div style=\"margin-top: 6px; font-size: 15px; line-height: 1.5\">{{ matchMsg }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeMatch }}\" class=\"btn\" style=\"font: inherit; margin-top: 20px; font-size: 15px; font-weight: 700; padding: 12px 20px; border-radius: 10px; border: 0; background: #FFFFFF; color: #191540; cursor: pointer\">Keep swiping<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div style=\"display: flex; gap: 18px; margin-top: 6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ passTop }}\" aria-label=\"Pass\" class=\"btn\" style=\"width: 62px; height: 62px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ likeTop }}\" aria-label=\"Swipe right\" class=\"btn\" style=\"width: 62px; height: 62px; border-radius: 999px; border: 0; background: #F0603C; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -12px rgba(240,96,60,0.8)\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"height: 84px; margin-top: 18px; width: 400px\">\n<sc-if value=\"{{ showDirect }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display: flex; align-items: center; gap: 12px; background: #FFFFFF; color: #1A1A1A; border-radius: 14px; padding: 14px 16px; box-shadow: 0 18px 40px -20px rgba(0,0,0,0.6)\">\n<span style=\"flex-shrink: 0; width: 8px; height: 8px; border-radius: 999px; background: #E0A63A\"><\u002Fspan>\n<span style=\"flex-grow: 1; font-size: 14px; line-height: 1.45\">{{ directText }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ closeDirect }}\" style=\"font: inherit; flex-shrink: 0; font-size: 13px; font-weight: 700; padding: 9px 12px; border-radius: 8px; border: 0; background: #191540; color: #FFFFFF; cursor: pointer\">{{ directCta }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"price\" style=\"max-width: 1120px; margin: 0 auto; padding: 40px 32px 120px\">\n<div class=\"rv\" style=\"text-align: center\">\n<h2 style=\"margin: 0; font-size: 48px; letter-spacing: -0.035em; font-weight: 800\">Free to try for five days.<\u002Fh2>\n<p style=\"margin: 16px auto 0; max-width: 560px; font-size background:#FFFFFF;color:#191540';\n\n    var compare = COMPARE.map(function (r) {\n      return {\n        label: r.label,\n        cells: r.v.map(function (v, j) {\n          return { yes: v === 'yes', part: v === 'part', no: v === 'no', bg: j === 0 ? 'background:#F3F2FE' : '' };\n        })\n      };\n    });\n\n    return {\n      accent: accent,\n      personas: personas,\n      days: days,\n      fillStyle: 'transform:scaleX(' + (s.day / 4) + ')',\n      cur: {\n        n: s.day + 1, feat: cur.feat, task: cur.task, why: cur.why, cta: cur.cta,\n        badgeStyle: 'background:' + cur.bg + ';color:' + cur.ink,\n        ctaStyle: 'background:' + cur.color\n      },\n      segs: segs,\n      personaLabel: personaName,\n      paceNote: paceNote,\n      prevDay: function () { self.setState({ day: Math.max(0, s.day - 1) }); },\n      nextDay: function () { self.setState({ day: Math.min(4, s.day + 1) }); },\n      lensSeek: function () { self.setState({ lens: 'seeking', idx: 0, gone: {}, dx: 0, match: null, direct: null }); },\n      lensOffer: function () { self.setState({ lens: 'offering', idx: 0, gone: {}, dx: 0, match: null, direct: null }); },\n      lensSeekStyle: s.lens === 'seeking' ? lit : dim,\n      lensOfferStyle: s.lens === 'offering' ? lit : dim,\n      cards: cards,\n      deckDone: s.idx >= list.length,\n      restart: function () { self.setState({ idx: 0, gone: {}, dx: 0, match: null, direct: null }); },\n      passTop: function () { self.swipe(-1); },\n      likeTop: function () { self.swipe(1); },\n      showMatch: !!m,\n      matchName: m ? m.name.split(' ')[0] : '',\n      matchInitials: m ? m.initials : '',\n      matchAv: m ? 'background:' + m.av : '',\n      matchMsg: m ? m.msg : '',\n      closeMatch: function () { self.setState({ match: null }); },\n      showDirect: !!s.direct && !m,\n      directText: s.direct ? s.direct.text : '',\n      directCta: s.direct ? s.direct.cta : '',\n      closeDirect: function () { self.setState({ direct: null }); },\n      compare: compare,\n      included: INCLUDED\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
